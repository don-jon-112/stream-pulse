<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="normal">
  <title>OBS Chat Overlay - StreamPulse</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* OBS Transparent Canvas */
    :root {
      color-scheme: normal !important;
      background: transparent !important;
      background-color: transparent !important;
      --bg-bubble: rgba(13, 17, 27, 0.88);
      --text-custom: #ffffff;
    }

    html, body {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      color-scheme: normal !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
    }

    #overlayChatContainer {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    #overlayChatContainer.align-right {
      align-items: flex-end !important;
      text-align: right !important;
    }

    #overlayChatContainer.align-right .overlay-item {
      margin-left: auto !important;
      flex-direction: row-reverse !important;
      text-align: right !important;
    }

    #overlayChatContainer.align-right .overlay-body {
      align-items: flex-end !important;
    }

    #overlayChatContainer.align-right .overlay-header {
      flex-direction: row-reverse !important;
      justify-content: flex-end !important;
    }

    #overlayChatContainer.align-right .overlay-reply-quote {
      text-align: right !important;
      border-left: none !important;
      border-right: 2px solid var(--accent-primary) !important;
    }

    /* Direction: normal (new at bottom) or reverse */
    .overlay-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-bubble);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      animation: overlaySlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 650px;
      width: fit-content;
      word-break: break-word;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    @keyframes overlaySlideIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .overlay-item.fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    /* Highlighted / Channel Points Redeem Item */
    .overlay-item.highlighted {
      background: linear-gradient(135deg, rgba(145, 70, 255, 0.3) 0%, rgba(13, 17, 27, 0.95) 100%);
      border: 1px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.45);
    }
    .overlay-item.is-redeem .overlay-text,
    .overlay-text.is-redeem {
      font-style: italic !important;
    }

    /* Event Banner Item (Sub, Raid, Bits, Super Chat, Gifts) */
    .overlay-item.overlay-event {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35) 0%, rgba(13, 17, 27, 0.95) 100%);
      border-left: 4px solid var(--accent-primary);
    }
    .overlay-item.overlay-event.youtube-superchat {
      border-left-color: #00bfa5;
    }
    .overlay-item.overlay-event.twitch-raid {
      border-left-color: #f43f5e;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.3) 0%, rgba(13, 17, 27, 0.95) 100%);
    }

    .overlay-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #1e2638;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: #fff;
    }

    .overlay-body {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .overlay-header {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Twitch & Platform Badge Icons */
    .badge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      gap: 3px;
    }
    .badge-icon.broadcaster {
      background: #e91e63;
      color: #fff;
    }
    .badge-icon.mod {
      background: #00ad03;
      color: #fff;
    }
    .badge-icon.vip {
      background: #e005b9;
      color: #fff;
    }
    .badge-icon.sub {
      background: #9146ff;
      color: #fff;
    }
    .badge-icon.redeem-tag {
      background: #a855f7;
      color: #fff;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }

    /* Official Platform Badges */
    .platform-official-badge {
      display: inline-block;
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      border-radius: 2px;
      vertical-align: middle;
      object-fit: contain;
      margin-right: 4px;
    }
    .twitch-badge {
      width: 18px;
      height: 18px;
      border-radius: 2px;
      vertical-align: middle;
    }
    .yt-official-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      vertical-align: middle;
      margin-right: 4px;
    }
    .yt-mod-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .yt-mod-badge svg {
      width: 15px;
      height: 15px;
      filter: drop-shadow(0 1px 2px rgba(94, 132, 241, 0.6));
    }
    .yt-owner-badge {
      background: #ff0000;
      color: #ffffff;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(255, 0, 0, 0.4);
    }
    .yt-owner-badge svg {
      width: 11px;
      height: 11px;
    }
    .yt-member-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      vertical-align: middle;
    }
    .yt-member-badge-pill {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }

    .overlay-author-name {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--author-custom, #67e8f9);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .overlay-text {
      font-size: 0.95rem;
      color: var(--text-custom, #ffffff);
      line-height: 1.45;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .overlay-event-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #67e8f9;
    }

    /* Emotes */
    .chat-emote {
      display: inline-block;
      vertical-align: middle;
      height: 1.7em;
      max-height: 32px;
      width: auto;
      margin: -2px 3px;
    }

    /* THEMES */
    body.theme-minimal .overlay-item {
      background: rgba(0, 0, 0, 0.75);
      border: none;
      backdrop-filter: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    body.theme-light .overlay-item {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    body.theme-light .overlay-author-name { color: #1e293b; text-shadow: none; }
    body.theme-light .overlay-text { color: #0f172a; text-shadow: none; }

    body.theme-cyberpunk .overlay-item {
      background: rgba(10, 10, 25, 0.9);
      border: 1px solid #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
      border-radius: 2px;
    }

    /* Platform Tag / Icon */
    .overlay-platform-tag {
      display: none;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      border-radius: 4px;
      margin-right: 2px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .overlay-platform-tag svg {
      width: 12px;
      height: 12px;
      display: block;
    }
    .overlay-platform-tag.platform-twitch {
      background: #9146ff;
      color: #ffffff;
    }
    .overlay-platform-tag.platform-youtube {
      background: #ff0000;
      color: #ffffff;
    }
    .overlay-platform-tag.platform-tiktok {
      background: #000000;
      color: #00f2fe;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* THEME: SIMPLE SINGLE-LINE
       Layout: [circle img avatar] [platform] [badge] [nama] [message]
    */
    body.theme-simple .overlay-item {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 4px 12px 4px 5px;
      border-radius: 9999px;
      background: var(--bg-bubble, rgba(13, 17, 27, 0.88));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      max-width: 100%;
      width: fit-content;
      line-height: 1.35;
    }

    body.theme-simple .overlay-item.no-avatar {
      padding-left: 12px;
    }

    /* Circle Avatar */
    body.theme-simple .overlay-avatar {
      width: 24px;
      height: 24px;
      min-width: 24px;
      min-height: 24px;
      border-radius: 50%;
      font-size: 0.72rem;
      margin: 0;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    /* Inline Flow Body */
    body.theme-simple .overlay-body {
      display: inline;
      vertical-align: middle;
      flex: 1;
      min-width: 0;
      white-space: normal;
      line-height: 1.4;
    }

    /* Header: inline-flex containing platform, badge, author */
    body.theme-simple .overlay-header {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
      margin-right: 4px;
      flex-shrink: 0;
    }

    /* Platform Tag in Simple Theme */
    body.theme-simple .overlay-platform-tag {
      display: inline-flex;
    }

    /* Badges */
    body.theme-simple .badge-icon {
      padding: 1px 4px;
      font-size: 0.6rem;
      height: 16px;
      vertical-align: middle;
    }
    body.theme-simple .platform-official-badge,
    body.theme-simple .twitch-badge {
      width: 16px;
      height: 16px;
      min-width: 16px;
      min-height: 16px;
      margin-right: 2px;
      vertical-align: middle;
    }
    body.theme-simple .yt-official-badge {
      margin-right: 2px;
      vertical-align: middle;
    }

    /* Author Name */
    body.theme-simple .overlay-author-name {
      display: inline;
      font-weight: 700;
      font-size: 0.95em;
      vertical-align: middle;
      margin-right: 2px;
    }
    body.theme-simple .overlay-author-name::after {
      content: ':';
      margin-left: 1px;
      margin-right: 4px;
      opacity: 0.65;
    }

    /* Message Text right next to author */
    body.theme-simple .overlay-text {
      display: inline;
      vertical-align: middle;
      font-size: 0.95em;
      color: var(--text-custom, #ffffff);
      margin: 0;
      padding: 0;
    }

    body.theme-simple .overlay-message-content {
      display: inline;
      vertical-align: middle;
      word-break: break-word;
    }

    /* Emotes */
    body.theme-simple .chat-emote {
      height: 1.35em;
      max-height: 22px;
      width: auto;
      margin: -2px 2px;
      vertical-align: middle;
    }

    /* Reply Quote inside Simple Theme */
    body.theme-simple .overlay-reply-quote {
      display: inline-flex;
      align-items: center;
      margin: 0 4px 0 0;
      padding: 0 5px;
      font-size: 0.78em;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      border-left: 2px solid var(--accent-primary, #6366f1);
      vertical-align: middle;
    }

    /* Event & Alert in Simple Theme */
    body.theme-simple .overlay-item.overlay-event {
      border-radius: 9999px;
      padding: 4px 12px 4px 5px;
    }
    body.theme-simple .overlay-item.overlay-event.no-avatar {
      padding-left: 12px;
    }
    body.theme-simple .overlay-item.overlay-event .overlay-event-title {
      display: inline;
      font-size: 0.88em;
      font-weight: 700;
      margin-right: 4px;
      vertical-align: middle;
    }

    /* Right Align Support for Simple Theme */
    #overlayChatContainer.align-right body.theme-simple .overlay-item,
    body.theme-simple #overlayChatContainer.align-right .overlay-item {
      flex-direction: row !important;
      text-align: left !important;
      margin-left: auto !important;
      margin-right: 0 !important;
    }
    body.theme-simple #overlayChatContainer.align-right .overlay-header {
      flex-direction: row !important;
      justify-content: flex-start !important;
    }
  </style>

  <!-- Injected User Custom CSS -->
  <style id="customOverlayCss"></style>
</head>
<body>

  <div id="overlayChatContainer">
    <!-- Messages flow in dynamically -->
  </div>

  <script src="/js/socket.io.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('overlayChatContainer');
      const customCssEl = document.getElementById('customOverlayCss');
      const urlParams = new URLSearchParams(window.location.search);

      const profileId = urlParams.get('id') || 'default';
      let config = {
        theme: urlParams.get('theme') || 'simple',
        fontSize: parseInt(urlParams.get('fontSize') || '15', 10),
        hideDelay: parseInt(urlParams.get('hideDelay') || '0', 10),
        showBadges: urlParams.get('badges') !== '0',
        showTwitchBadges: urlParams.get('twitchBadges') !== '0',
        showYtBadges: urlParams.get('ytBadges') !== '0',
        showAvatars: urlParams.get('avatars') !== '0',
        showAlerts: urlParams.get('alerts') !== '0',
        showEmotes: urlParams.get('emotes') !== '0',
        showTikTokLikes: urlParams.get('ttLikes') !== '0' && urlParams.get('tiktokLikes') !== '0',
        showTikTokGifts: urlParams.get('ttGifts') !== '0' && urlParams.get('tiktokGifts') !== '0',
        authorColor: urlParams.get('authorColor') || '',
        useTwitchColors: urlParams.get('useTwitchColors') !== '0',
        containerBgColor: urlParams.get('containerBg') || '#0a0e17',
        containerBgOpacity: urlParams.get('containerOpacity') !== null ? parseInt(urlParams.get('containerOpacity'), 10) : 0,
        twitch: urlParams.get('twitch') || '',
        youtube: urlParams.get('youtube') || '',
        tiktok: urlParams.get('tiktok') || '',
        customCss: '',
        customJs: ''
      };

      // Load profile from backend if id is provided
      try {
        const res = await fetch(`/api/overlays/${profileId}`);
        if (res.ok) {
          const profile = await res.json();
          config = {
            ...config,
            ...profile,
            showTikTokLikes: urlParams.get('ttLikes') !== null 
              ? (urlParams.get('ttLikes') !== '0') 
              : (profile.showTikTokLikes !== undefined ? profile.showTikTokLikes : true),
            showTikTokGifts: urlParams.get('ttGifts') !== null 
              ? (urlParams.get('ttGifts') !== '0') 
              : (profile.showTikTokGifts !== undefined ? profile.showTikTokGifts : true),
            showTwitchBadges: urlParams.get('twitchBadges') !== null
              ? (urlParams.get('twitchBadges') !== '0')
              : (profile.showTwitchBadges !== undefined ? profile.showTwitchBadges : (profile.showBadges !== undefined ? profile.showBadges : true)),
            showYtBadges: urlParams.get('ytBadges') !== null
              ? (urlParams.get('ytBadges') !== '0')
              : (profile.showYtBadges !== undefined ? profile.showYtBadges : (profile.showBadges !== undefined ? profile.showBadges : true)),
            authorColor: urlParams.get('authorColor') || profile.authorColor || config.authorColor,
            useTwitchColors: urlParams.get('useTwitchColors') !== null
              ? (urlParams.get('useTwitchColors') !== '0')
              : (profile.useTwitchColors !== undefined ? profile.useTwitchColors : true),
            containerBgColor: urlParams.get('containerBg') || profile.containerBgColor || config.containerBgColor || '#0a0e17',
            containerBgOpacity: urlParams.get('containerOpacity') !== null 
              ? parseInt(urlParams.get('containerOpacity'), 10) 
              : (profile.containerBgOpacity !== undefined ? profile.containerBgOpacity : 0),
            // Override with URL query params if explicitly present
            twitch: urlParams.get('twitch') || profile.twitch || config.twitch,
            youtube: urlParams.get('youtube') || profile.youtube || config.youtube,
            tiktok: urlParams.get('tiktok') || profile.tiktok || config.tiktok
          };
        }
      } catch (e) {
        console.warn('[Overlay] Using query params config');
      }

      // Apply Theme & Font Size
      const activeTheme = config.theme || 'simple';
      if (activeTheme !== 'glass') {
        document.body.classList.add(`theme-${activeTheme}`);
      }
      if (config.fontSize) {
        document.documentElement.style.fontSize = `${config.fontSize}px`;
      }

      function hexToRgba(hex, alpha = 0.88) {
        if (!hex || hex === 'transparent') return 'transparent';
        let c = String(hex).replace('#', '').trim();
        if (c.length === 3) c = c.split('').map(x => x + x).join('');
        const num = parseInt(c, 16);
        if (isNaN(num)) return hex;
        return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
      }

      function applyVisualConfig() {
        if (config.chatAlign === 'right') {
          container.classList.add('align-right');
        } else {
          container.classList.remove('align-right');
        }

        if (config.bgColor) {
          const alpha = config.bgOpacity !== undefined ? (parseInt(config.bgOpacity, 10) / 100) : 0.88;
          const rgba = hexToRgba(config.bgColor, alpha);
          document.documentElement.style.setProperty('--bg-bubble', rgba);
        }

        if (config.textColor) {
          document.documentElement.style.setProperty('--text-custom', config.textColor);
        }
        if (config.authorColor) {
          document.documentElement.style.setProperty('--author-custom', config.authorColor);
        }

        // Kustomisasi background box / container chat
        if (config.containerBgColor && config.containerBgOpacity !== undefined) {
          const cAlpha = parseInt(config.containerBgOpacity, 10) / 100;
          if (cAlpha > 0) {
            const cRgba = hexToRgba(config.containerBgColor, cAlpha);
            container.style.backgroundColor = cRgba;
            container.style.padding = '14px';
            container.style.borderRadius = '16px';
            container.style.border = '1px solid rgba(255, 255, 255, 0.12)';
            container.style.backdropFilter = cAlpha > 0.05 ? 'blur(12px)' : 'none';
          } else {
            container.style.backgroundColor = 'transparent';
            container.style.padding = '0';
            container.style.borderRadius = '0';
            container.style.border = 'none';
            container.style.backdropFilter = 'none';
          }
        } else {
          container.style.backgroundColor = 'transparent';
          container.style.padding = '0';
          container.style.borderRadius = '0';
          container.style.border = 'none';
          container.style.backdropFilter = 'none';
        }
      }
      applyVisualConfig();

      // Apply Custom CSS
      if (config.customCss) {
        customCssEl.textContent = config.customCss;
      }

      // State
      let twitchEmotes = {
        'OMEGALUL': 'https://cdn.7tv.app/emote/603cb1364d2bf5000d024628/1x.webp',
        'KEKW': 'https://cdn.7tv.app/emote/60b00d8299aa123b3a62ea2e/1x.webp',
        'catJAM': 'https://cdn.7tv.app/emote/60ae3e512496a798b671a525/1x.webp',
        'PepePls': 'https://cdn.7tv.app/emote/60ae3ec62496a798b671a539/1x.webp',
        'monkaS': 'https://cdn.7tv.app/emote/603cb1354d2bf5000d024606/1x.webp',
        'Pog': 'https://cdn.7tv.app/emote/6041074e548231000d41865c/1x.webp'
      };

      // Fetch all global 7TV & BTTV emotes immediately
      fetch('/api/emotes/global')
        .then(r => r.json())
        .then(data => {
          if (data && typeof data === 'object') {
            twitchEmotes = { ...data, ...twitchEmotes };
          }
        })
        .catch(() => {});

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function maskLinksInText(text) {
        if (!config.maskLinks || !text) return text;
        return text.replace(/(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9.-]+\.(com|net|org|io|gg|id|tv|be|me|link|site|xyz|online|app|co|live)(\/[^\s]*)?)/gi, '[LINK]');
      }

      // Emote Parsers
      function parse7tvTokens(rawText) {
        if (!rawText) return '';
        const masked = maskLinksInText(rawText);
        if (!config.showEmotes) return escapeHtml(masked);
        const tokens = masked.split(/(\s+)/);
        return tokens.map(token => {
          if (!token || /^\s+$/.test(token)) return token;
          const clean = token.trim();
          if (clean === '[LINK]') {
            return `<span class="masked-link" style="color:#94a3b8; font-weight:700; background:rgba(255,255,255,0.08); padding:1px 5px; border-radius:3px;">[LINK]</span>`;
          }
          if (twitchEmotes[clean]) {
            return `<img class="chat-emote" src="${escapeHtml(twitchEmotes[clean])}" alt="${escapeHtml(clean)}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          return escapeHtml(token);
        }).join('');
      }

      function formatTwitchEmotes(rawText, userstateEmotes) {
        if (!rawText) return '';
        if (!config.showEmotes) return escapeHtml(rawText);
        if (!userstateEmotes || Object.keys(userstateEmotes).length === 0) {
          return parse7tvTokens(rawText);
        }

        const ranges = [];
        for (const emoteId in userstateEmotes) {
          const occs = userstateEmotes[emoteId];
          if (Array.isArray(occs)) {
            for (const occ of occs) {
              const [start, end] = occ.split('-').map(Number);
              if (!isNaN(start) && !isNaN(end)) {
                ranges.push({ start, end: end + 1, id: emoteId });
              }
            }
          }
        }
        ranges.sort((a, b) => a.start - b.start);

        let html = '';
        let last = 0;
        for (const r of ranges) {
          if (r.start < last) continue;
          if (r.start > last) {
            html += parse7tvTokens(rawText.substring(last, r.start));
          }
          const emoteName = rawText.substring(r.start, r.end);
          html += `<img class="chat-emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/1.0" alt="${escapeHtml(emoteName)}" referrerpolicy="no-referrer" loading="lazy">`;
          last = r.end;
        }
        if (last < rawText.length) {
          html += parse7tvTokens(rawText.substring(last));
        }
        return html;
      }

      const TWITCH_OFFICIAL_BADGES = {

      // Official Platform Badges Renderer
      function renderBadges(chat) {
        if (!config.showBadges) return '';
        let html = '';
        const author = chat.author || {};

        if (chat.platform === 'twitch') {
          if (config.showTwitchBadges === false) return '';
          // Prioritaskan custom badges dari channel Twitch (max 3 badges)
          if (Array.isArray(author.badgesList) && author.badgesList.length > 0) {
            author.badgesList.slice(0, 3).forEach(b => {
              if (b && b.url) {
                html += `<img src="${escapeHtml(b.url)}" class="platform-official-badge twitch-badge" alt="${escapeHtml(b.title || 'Badge')}" title="${escapeHtml(b.title || 'Badge')}" referrerpolicy="no-referrer" loading="lazy">`;
              }
            });
            return html;
          }

          const badges = author.badges || {};
          if (badges.broadcaster || author.isBroadcaster) {
            const b = TWITCH_OFFICIAL_BADGES.broadcaster;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          if (badges.moderator || author.isMod) {
            const b = TWITCH_OFFICIAL_BADGES.moderator;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          if (badges.vip) {
            const b = TWITCH_OFFICIAL_BADGES.vip;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          if (badges.subscriber || author.isSub) {
            const b = TWITCH_OFFICIAL_BADGES.subscriber;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          if (badges.partner) {
            const b = TWITCH_OFFICIAL_BADGES.partner;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
          if (badges.premium || badges.turbo) {
            const b = TWITCH_OFFICIAL_BADGES.premium;
            html += `<img src="${b.url}" class="platform-official-badge twitch-badge" alt="${b.title}" title="${b.title}" referrerpolicy="no-referrer" loading="lazy">`;
          }
        } else if (chat.platform === 'youtube') {
          if (config.showYtBadges === false) return '';
          // 1. YouTube Official Owner Badge
          if (author.isOwner) {
            html += `
              <span class="yt-official-badge yt-owner-badge" title="Channel Owner / Host">
                <svg viewBox="0 0 16 16" width="12" height="12" fill="#ffffff" aria-hidden="true"><path d="M8 1l2.3 4.7 5.2.8-3.8 3.7.9 5.2L8 12.9l-4.6 2.5.9-5.2-3.8-3.7 5.2-.8L8 1z"/></svg>
                <span>Owner</span>
              </span>`;
          }
          // 2. YouTube Official Moderator Blue Wrench
          if (author.isMod) {
            html += `
              <span class="yt-official-badge yt-mod-badge" title="Moderator">
                <svg viewBox="0 0 16 16" width="14" height="14" fill="#5e84f1" aria-hidden="true"><path d="M9.64 5.64l-1.28-1.28a3.16 3.16 0 0 0-4.41.22 3.16 3.16 0 0 0 .22 4.41l1.28 1.28 7.37 7.37a1.05 1.05 0 0 0 1.49 0l1.49-1.49a1.05 1.05 0 0 0 0-1.49L9.64 5.64zM3.48 4.97a1.77 1.77 0 0 1 2.5 0l.75.75-1.5 1.5-.75-.75a1.77 1.77 0 0 1 0-2.5z"/></svg>
              </span>`;
          }
          // 3. YouTube Member Custom Badge / Icon
          if (author.memberBadge) {
            html += `<img src="${escapeHtml(author.memberBadge)}" class="platform-official-badge yt-member-badge" alt="Member" title="Channel Member" referrerpolicy="no-referrer" loading="lazy">`;
          } else if (author.isSub) {
            html += `
              <span class="yt-official-badge yt-member-badge-pill" title="Member">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="#00bfa5" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.7 6.3l-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.75.75 0 1 1 1.06-1.06l1.47 1.47 3.97-3.97a.75.75 0 0 1 1.06 1.06z"/></svg>
              </span>`;
          }
        }

        if (chat.isRedeem) {
          html += `<span class="badge-icon redeem-tag">💠 Points</span>`;
        }

        return html;
      }

      // Platform Icon / Tag Renderer (Twitch, YouTube, TikTok)
      function renderPlatformTag(platform) {
        const p = String(platform || '').toLowerCase();
        if (p === 'twitch') {
          return `<span class="overlay-platform-tag platform-twitch" title="Twitch"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.429h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg></span>`;
        }
        if (p === 'youtube') {
          return `<span class="overlay-platform-tag platform-youtube" title="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></span>`;
        }
        if (p === 'tiktok') {
          return `<span class="overlay-platform-tag platform-tiktok" title="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.82 4.49 6.3 6.3 0 0 0 1.84-4.48V8.78a8.28 8.28 0 0 0 4.93 1.62V6.95a4.85 4.85 0 0 1-1-.26z"/></svg></span>`;
        }
        return '';
      }

      // Pastikan warna teks username terbaca kontras di latar belakang gelap/transparan OBS
      function ensureReadableColor(hex) {
        if (!hex || typeof hex !== 'string') return '#67e8f9';
        let clean = hex.trim();
        if (!clean.startsWith('#')) return clean;
        clean = clean.replace('#', '');
        if (clean.length === 3) {
          clean = clean.split('').map(c => c + c).join('');
        }
        if (clean.length !== 6) return hex;

        const r = parseInt(clean.substring(0, 2), 16);
        const g = parseInt(clean.substring(2, 4), 16);
        const b = parseInt(clean.substring(4, 6), 16);
        if (isNaN(r) || isNaN(g) || isNaN(b)) return hex;

        // Perceived luminance (ITU-R BT.709)
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;

        // Jika warna terlalu gelap (misalnya #0000FF blue), naikkan kecerahan agar tetap terbaca jelas
        if (luminance < 95) {
          const factor = (95 - luminance) / 255;
          const nr = Math.min(255, Math.round(r + (255 - r) * factor * 0.85 + 40));
          const ng = Math.min(255, Math.round(g + (255 - g) * factor * 0.85 + 40));
          const nb = Math.min(255, Math.round(b + (255 - b) * factor * 0.85 + 50));
          return `rgb(${nr}, ${ng}, ${nb})`;
        }
        return hex;
      }

      function getAuthorColor(author, platform) {
        if (!author) return config.authorColor || '#67e8f9';

        // Jika platform Twitch
        if (platform === 'twitch') {
          // Opsi toggle apakah ingin menggunakan warna masing-masing user Twitch (default true)
          if (config.useTwitchColors !== false) {
            if (author.color) {
              return ensureReadableColor(author.color);
            }
            if (author.name) {
              const TWITCH_PALETTE = [
                '#FF4A4A', '#38BDF8', '#00FF7F', '#FF7F50', '#A3E635',
                '#FF6B35', '#2DD4BF', '#FBBF24', '#FB923C', '#22D3EE',
                '#60A5FA', '#C084FC', '#4ADE80', '#34D399', '#F472B6'
              ];
              let hash = 0;
              const name = author.name.toLowerCase();
              for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
              }
              return TWITCH_PALETTE[Math.abs(hash) % TWITCH_PALETTE.length];
            }
          } else if (config.authorColor) {
            return config.authorColor;
          }
        }

        // Platform selain Twitch atau jika warna kustom umum diset
        if (config.authorColor) {
          return config.authorColor;
        }

        if (author.color) {
          return ensureReadableColor(author.color);
        }

        return '#67e8f9';
      }

      // Cache ID pesan untuk mencegah tampilan duplikat di OBS overlay
      const processedOverlayMsgIds = new Set();

      // Cache untuk mencegah duplikasi alert (Bits, Superchat, Gift, Redeem) antara new_event dan new_chat
      const recentRedeemKeys = new Set();
      const recentAlertKeys = new Set();

      function isDuplicateRedeem(author, text) {
        const cleanAuthor = String(author || '').trim().toLowerCase();
        const cleanText = String(text || '').trim().toLowerCase();
        const key = `${cleanAuthor}__${cleanText}`;
        if (recentRedeemKeys.has(key)) return true;
        recentRedeemKeys.add(key);
        setTimeout(() => {
          recentRedeemKeys.delete(key);
        }, 15000);
        return false;
      }

      function recordRecentAlert(author, text) {
        if (!text) return;
        const cleanAuthor = String(author || '').trim().toLowerCase();
        const cleanText = String(text || '').trim().toLowerCase();
        const key = `${cleanAuthor}__${cleanText}`;
        recentAlertKeys.add(key);
        setTimeout(() => {
          recentAlertKeys.delete(key);
        }, 15000);
      }

      function isDuplicateAlertChat(author, text) {
        if (config.showAlerts === false) return false;
        const cleanAuthor = String(author || '').trim().toLowerCase();
        const cleanText = String(text || '').trim().toLowerCase();
        const key = `${cleanAuthor}__${cleanText}`;
        return recentAlertKeys.has(key);
      }

      // Add Chat Item to Overlay
      function addOverlayMessage(item) {
        if (!item) return;

        // Cegah duplikasi pesan chat
        const dedupeKey = item.id || `${item.platform || ''}_${item.author?.name || ''}_${item.text || ''}`;
        if (processedOverlayMsgIds.has(dedupeKey)) return;
        processedOverlayMsgIds.add(dedupeKey);
        if (processedOverlayMsgIds.size > 200) {
          const first = processedOverlayMsgIds.values().next().value;
          processedOverlayMsgIds.delete(first);
        }

        const author = item.author || {};
        const authorName = author.name || 'Anonymous';

        // Jika showAlerts aktif di OBS, abaikan bubble chat biasa yang bersumber dari alert (Bits, Superchat, Gifts, dll)
        if (config.showAlerts !== false) {
          if (item.isBits || author.isBits || item.superchat || item.isGift || item.isGiftMembership || item.isMembership) {
            return;
          }
          if (isDuplicateAlertChat(authorName, item.text)) {
            return;
          }
        }

        // Cegah duplikasi Channel Points Redeem yang sama dari new_event
        if (item.isRedeem && isDuplicateRedeem(authorName, item.text)) {
          return;
        }

        const el = document.createElement('div');
        el.className = `overlay-item platform-${item.platform || 'twitch'}${config.showAvatars ? ' has-avatar' : ' no-avatar'}`;
        el.dataset.platform = item.platform || '';
        if (item.isRedeem) el.classList.add('is-redeem', 'highlighted');

        const authorColor = getAuthorColor(author, item.platform);
        const initial = (authorName[0] || '?').toUpperCase();

        const avatarHtml = config.showAvatars
          ? (author.avatar 
              ? `<img src="${escapeHtml(author.avatar)}" class="overlay-avatar" alt="${escapeHtml(authorName)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'overlay-avatar\\'>${initial}</div>'">`
              : `<div class="overlay-avatar">${initial}</div>`)
          : '';

        const platformTagHtml = renderPlatformTag(item.platform);
        const badgesHtml = renderBadges(item);
        let textHtml = '';
        if (item.platform === 'twitch') {
          textHtml = formatTwitchEmotes(item.text, item.emotes);
        } else if (item.platform === 'youtube' && Array.isArray(item.messageParts) && item.messageParts.length > 0) {
          textHtml = item.messageParts.map(part => {
            if (!part) return '';
            if (part.type === 'emoji' || part.url) {
              const emoteAlt = escapeHtml(part.alt || part.emojiText || 'emote');
              const emoteUrl = escapeHtml(part.url);
              return `<img class="chat-emote yt-custom-emote" src="${emoteUrl}" alt="${emoteAlt}" title="${emoteAlt}" referrerpolicy="no-referrer" loading="lazy">`;
            }
            return parse7tvTokens(part.text || '');
          }).join('');
        } else {
          let rawText = item.text || '';
          if (item.platform === 'tiktok') {
            rawText = rawText.replace(/\s*\([^)]*(?:diamond|💎)[^)]*\)/gi, '').trim();
          }
          textHtml = parse7tvTokens(rawText);
        }

        const isTwitchRedeem = (item.platform === 'twitch') && item.isRedeem;
        if (isTwitchRedeem) {
          const detail = item.redeemDetail || 'Channel Points';
          const cleanText = (item.text || '').trim();
          textHtml = cleanText.length > 0
            ? `💠 ${escapeHtml(authorName)} redeemed ${escapeHtml(detail)}: <i class="redeem-msg">${textHtml}</i>`
            : `💠 ${escapeHtml(authorName)} redeemed ${escapeHtml(detail)}`;
        }

        let replyHtml = '';
        if (item.reply && item.reply.parentText) {
          replyHtml = `
            <div class="overlay-reply-quote">
              <span class="overlay-reply-icon">↩</span>
              <span class="overlay-reply-author">@${escapeHtml(item.reply.parentAuthor || 'User')}:</span>
              <span class="overlay-reply-text"><i>${escapeHtml(item.reply.parentText)}</i></span>
            </div>
          `;
        }

        el.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            <div class="overlay-header">
              ${platformTagHtml}
              ${badgesHtml}
              ${item.isRedeem ? '<span class="badge-icon redeem-tag">💠 Redeem</span>' : ''}
              <span class="overlay-author-name" style="color: ${escapeHtml(authorColor)} ${item.platform === 'twitch' && config.useTwitchColors !== false ? '!important' : ''};">${escapeHtml(authorName)}</span>
            </div>
            <div class="overlay-text ${item.isRedeem ? 'is-redeem bubble-pink' : ''}">${replyHtml}<span class="overlay-message-content">${textHtml}</span></div>
          </div>
        `;

        container.appendChild(el);

        // Batasi jumlah bubble chat di layar OBS
        const maxLimit = parseInt(config.maxMessages, 10) || 15;
        while (container.children.length > maxLimit) {
          container.removeChild(container.firstChild);
        }

        // Auto-Hide Message after N seconds
        if (config.hideDelay && config.hideDelay > 0) {
          setTimeout(() => {
            el.classList.add('fade-out');
            setTimeout(() => {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 500);
          }, config.hideDelay * 1000);
        }
      }

      // Cache ID event untuk mencegah duplikasi alert di OBS overlay
      const processedOverlayEventIds = new Set();

      // Add Event Item (Raid, Cheer, Sub, Super Chat, Gifts, Channel Points Redeem)
      function addOverlayEvent(evt) {
        if (!evt) return;

        // Filter event TikTok berdasarkan pengaturan checkbox
        if (evt.platform === 'tiktok') {
          if (evt.eventType === 'like' && config.showTikTokLikes === false) return;
          if (evt.eventType === 'gift' && config.showTikTokGifts === false) return;
        }

        const isTwitchRedeem = (evt.platform === 'twitch') && evt.eventType === 'redeem';
        if (!config.showAlerts && !isTwitchRedeem) return;

        const evtKey = evt.id || `${evt.platform || ''}_${evt.eventType || ''}_${evt.author || ''}_${evt.detail || ''}_${evt.message || ''}`;
        if (processedOverlayEventIds.has(evtKey)) return;
        processedOverlayEventIds.add(evtKey);
        if (processedOverlayEventIds.size > 100) {
          const first = processedOverlayEventIds.values().next().value;
          processedOverlayEventIds.delete(first);
        }

        const authorName = (typeof evt.author === 'object' ? evt.author.name : evt.author) || 'Viewer';

        // Cegah duplikasi Channel Points Redeem yang sama dari new_chat
        if (isTwitchRedeem && evt.message && isDuplicateRedeem(authorName, evt.message)) {
          return;
        }

        // Catat teks alert untuk mencegah duplikasi jika pesan chat serupa masuk
        if (evt.message) recordRecentAlert(authorName, evt.message);
        if (evt.detail) recordRecentAlert(authorName, evt.detail);

        const el = document.createElement('div');
        el.className = `overlay-item overlay-event platform-${evt.platform || 'twitch'}${config.showAvatars ? ' has-avatar' : ' no-avatar'}`;
        el.dataset.platform = evt.platform || '';
        if (isTwitchRedeem) el.classList.add('is-redeem', 'highlighted');
        if (evt.eventType === 'superchat') el.classList.add('youtube-superchat');
        if (evt.eventType === 'raid') el.classList.add('twitch-raid');

        const initial = (authorName[0] || '★').toUpperCase();
        const authorColor = getAuthorColor(typeof evt.author === 'object' ? evt.author : { name: authorName, color: evt.authorColor }, evt.platform);

        const avatarHtml = config.showAvatars
          ? (evt.avatar 
              ? `<img src="${escapeHtml(evt.avatar)}" class="overlay-avatar" alt="${escapeHtml(authorName)}" onerror="this.outerHTML='<div class=\\'overlay-avatar\\'>${initial}</div>'">`
              : `<div class="overlay-avatar" style="background: linear-gradient(135deg,#6366f1,#ec4899);">${initial}</div>`)
          : '';

        const platformTagHtml = renderPlatformTag(evt.platform);
        let badgesHtml = '';
        if (isTwitchRedeem) {
          badgesHtml = renderBadges({
            platform: 'twitch',
            author: typeof evt.author === 'object' ? evt.author : { name: authorName, badges: evt.badges, badgesList: evt.badgesList }
          });
        }

        let customTitle = evt.title;
        let customDetail = evt.detail || '';
        let customAlertBg = null;
        let customAlertTextColor = null;

        // Bersihkan teks dalam kurung diamond untuk gift TikTok (misal: "Rosa x10 (0 diamond)" atau "Rose x10 (10 💎)")
        if (evt.platform === 'tiktok') {
          if (customDetail) {
            customDetail = customDetail.replace(/\s*\([^)]*(?:diamond|💎)[^)]*\)/gi, '').trim();
          }
          if (customTitle) {
            customTitle = customTitle.replace(/\s*\([^)]*(?:diamond|💎)[^)]*\)/gi, '').trim();
          }
        }

        // Custom alert styling & templates per-event type
        if (evt.eventType === 'subscription' || evt.eventType === 'resub' || evt.eventType === 'subgift') {
          if (config.alertSubBg) customAlertBg = config.alertSubBg;
          if (config.alertSubTextColor) customAlertTextColor = config.alertSubTextColor;
          if (config.alertSubText) {
            customTitle = config.alertSubText.replace(/{author}|{user}/gi, authorName).replace(/{detail}/gi, customDetail);
            customDetail = '';
          }
        } else if (evt.eventType === 'cheer') {
          if (config.alertCheerBg) customAlertBg = config.alertCheerBg;
          if (config.alertCheerTextColor) customAlertTextColor = config.alertCheerTextColor;
          if (config.alertCheerText) {
            customTitle = config.alertCheerText.replace(/{author}|{user}/gi, authorName).replace(/{detail}|{bits}/gi, customDetail);
            customDetail = '';
          }
        } else if (evt.eventType === 'raid') {
          if (config.alertRaidBg) customAlertBg = config.alertRaidBg;
          if (config.alertRaidTextColor) customAlertTextColor = config.alertRaidTextColor;
          if (config.alertRaidText) {
            customTitle = config.alertRaidText.replace(/{author}|{user}/gi, authorName).replace(/{detail}|{viewers}/gi, customDetail);
            customDetail = '';
          }
        } else if (isTwitchRedeem) {
          if (config.alertRedeemBg) customAlertBg = config.alertRedeemBg;
          if (config.alertRedeemTextColor) customAlertTextColor = config.alertRedeemTextColor;
        }

        if (customAlertBg) {
          el.style.background = customAlertBg;
        }
        if (customAlertTextColor) {
          el.style.color = customAlertTextColor;
        }

        let bodyContent = '';
        if (isTwitchRedeem) {
          const detail = customDetail || evt.title || 'Channel Points';
          const msg = (evt.message || '').trim();
          let formattedText = msg.length > 0
            ? `💠 ${escapeHtml(authorName)} redeemed ${escapeHtml(detail)}: <i class="redeem-msg">${escapeHtml(msg)}</i>`
            : `💠 ${escapeHtml(authorName)} redeemed ${escapeHtml(detail)}`;
          if (config.alertRedeemText) {
            formattedText = config.alertRedeemText.replace(/{author}|{user}/gi, escapeHtml(authorName)).replace(/{detail}|{reward}/gi, escapeHtml(detail)).replace(/{message}/gi, escapeHtml(msg));
          }
          bodyContent = `
            <div class="overlay-header">
              ${platformTagHtml}
              ${badgesHtml}
              <span class="badge-icon redeem-tag">💠 Redeem</span>
              <span class="overlay-author-name" style="color:${escapeHtml(authorColor)} ${evt.platform === 'twitch' && config.useTwitchColors !== false ? '!important' : ''};">${escapeHtml(authorName)}</span>
            </div>
            <div class="overlay-event-title" ${customAlertTextColor ? `style="color:${escapeHtml(customAlertTextColor)};"` : ''}>${escapeHtml(customTitle)}${customDetail ? ` • ${escapeHtml(customDetail)}` : ''}</div>
            <div class="overlay-text is-redeem bubble-pink" style="font-style: italic; ${customAlertTextColor ? `color:${escapeHtml(customAlertTextColor)};` : ''}">${formattedText}</div>
          `;
        } else {
          // Bersihkan token bits seperti "cheer300" jika pesan hanya berisi instruksi cheer tanpa komentar tambahan
          let displayMsg = (evt.message || '').trim();
          if (evt.eventType === 'cheer') {
            displayMsg = displayMsg.replace(/\b[a-zA-Z]+\d+\b/gi, '').trim();
          }
          if (evt.platform === 'tiktok' && displayMsg) {
            displayMsg = displayMsg.replace(/\s*\([^)]*(?:diamond|💎)[^)]*\)/gi, '').trim();
          }
          if (displayMsg.toLowerCase() === String(evt.detail || '').toLowerCase() || displayMsg.toLowerCase() === String(evt.title || '').toLowerCase()) {
            displayMsg = '';
          }

          bodyContent = `
            <div class="overlay-header">
              ${platformTagHtml}
              <span class="overlay-author-name" style="color:${escapeHtml(authorColor)} ${evt.platform === 'twitch' && config.useTwitchColors !== false ? '!important' : ''};">${escapeHtml(authorName)}</span>
            </div>
            <div class="overlay-event-title" ${customAlertTextColor ? `style="color:${escapeHtml(customAlertTextColor)};"` : ''}>${escapeHtml(customTitle)}${customDetail ? ` • ${escapeHtml(customDetail)}` : ''}</div>
            ${displayMsg ? `<div class="overlay-text" style="font-style:italic; ${customAlertTextColor ? `color:${escapeHtml(customAlertTextColor)};` : ''}">"${escapeHtml(displayMsg)}"</div>` : ''}
          `;
        }

        el.innerHTML = `
          ${avatarHtml}
          <div class="overlay-body">
            ${bodyContent}
          </div>
        `;

        container.appendChild(el);

        const maxLimit = parseInt(config.maxMessages, 10) || 15;
        while (container.children.length > maxLimit) {
          container.removeChild(container.firstChild);
        }

        if (config.hideDelay && config.hideDelay > 0) {
          setTimeout(() => {
            el.classList.add('fade-out');
            setTimeout(() => {
              if (el.parentNode) el.parentNode.removeChild(el);
            }, 500);
          }, config.hideDelay * 1000);
        }
      }

      // Socket.io Connection
      const socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        // Subscribe to configured channels
        socket.emit('update_channels', {
          overlayId: profileId,
          twitch: config.twitch || '',
          youtube: config.youtube || '',
          tiktok: config.tiktok || ''
        });
      });

      socket.on('twitch_emotes', ({ emotes }) => {
        if (emotes) twitchEmotes = { ...twitchEmotes, ...emotes };
      });

      socket.on('new_chat', (chat) => {
        addOverlayMessage(chat);
      });

      socket.on('new_event', (evt) => {
        addOverlayEvent(evt);
      });

      // Listen for preview test simulations from Overlay Studio
      window.addEventListener('socket_sim', (e) => {
        const { type, data } = e.detail || {};
        if (type === 'chat') addOverlayMessage(data);
        if (type === 'event') addOverlayEvent(data);
      });

      // Listen for live preview config updates from Overlay Studio (Allows instant preview even for guest mode)
      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'update_preview_config') {
          const newCfg = e.data.config;
          if (!newCfg) return;
          const oldTwitch = config.twitch;
          const oldYoutube = config.youtube;
          const oldTiktok = config.tiktok;
          config = { ...config, ...newCfg };
          if (newCfg.showTwitchBadges !== undefined) config.showTwitchBadges = newCfg.showTwitchBadges;
          if (newCfg.showYtBadges !== undefined) config.showYtBadges = newCfg.showYtBadges;
          if (newCfg.showTikTokLikes !== undefined) config.showTikTokLikes = newCfg.showTikTokLikes;
          if (newCfg.showTikTokGifts !== undefined) config.showTikTokGifts = newCfg.showTikTokGifts;
          if (newCfg.theme) {
            document.body.className = newCfg.theme === 'glass' ? '' : `theme-${newCfg.theme}`;
          }
          if (newCfg.fontSize) {
            document.documentElement.style.fontSize = `${newCfg.fontSize}px`;
          }
          if (newCfg.customCss !== undefined && customCssEl) {
            customCssEl.textContent = newCfg.customCss;
          }
          applyVisualConfig();
          // If channels were updated in Studio, immediately update Socket.io live subscription
          if (newCfg.twitch !== undefined || newCfg.youtube !== undefined || newCfg.tiktok !== undefined) {
            if (config.twitch !== oldTwitch || config.youtube !== oldYoutube || config.tiktok !== oldTiktok) {
              socket.emit('update_channels', {
                twitch: config.twitch || '',
                youtube: config.youtube || '',
                tiktok: config.tiktok || ''
              });
            }
          }
        }
      });

      // Execute Custom JS safely
      if (config.customJs) {
        try {
          const fn = new Function('config', 'socket', config.customJs);
          fn(config, socket);
        } catch (err) {
          console.error('[Overlay Custom JS Error]:', err);
        }
      }
    });
  </script>
</body>
</html>
