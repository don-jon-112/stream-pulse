<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamPulse - Live Viewers Overlay</title>
  <meta name="description" content="Transparent Live Viewers Counter OBS Browser Source">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Reset & Transparent Canvas */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background: transparent !important;
      background-color: rgba(0, 0, 0, 0) !important;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Outer Wrapper for Alignment and Scaling */
    .overlay-viewport {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 12px;
      transform-origin: left center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .overlay-viewport.align-left { justify-content: flex-start; transform-origin: left center; }
    .overlay-viewport.align-center { justify-content: center; transform-origin: center center; }
    .overlay-viewport.align-right { justify-content: flex-end; transform-origin: right center; }

    /* Scale options */
    .overlay-viewport.scale-sm { transform: scale(0.85); }
    .overlay-viewport.scale-md { transform: scale(1.0); }
    .overlay-viewport.scale-lg { transform: scale(1.25); }
    .overlay-viewport.scale-xl { transform: scale(1.5); }

    /* Font options */
    body.font-jet { font-family: 'JetBrains Mono', monospace; }
    body.font-nunito { font-family: 'Nunito', sans-serif; }

    /* Pulse animation */
    @keyframes livePulse {
      0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes neonGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)) drop-shadow(0 0 16px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.9)) drop-shadow(0 0 24px rgba(168, 85, 247, 0.6)); }
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      animation: livePulse 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    /* =========================================================================
       THEME STYLES (Frost, Neon, Flat Dark, Flat Light, Translucent)
       ========================================================================= */

    /* 1. FROST GLASS (Default Modern) */
    .theme-frost .viewers-widget {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    /* 2. CYBER NEON */
    .theme-neon .viewers-widget {
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid #06b6d4;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), inset 0 0 12px rgba(168, 85, 247, 0.25);
      color: #f8fafc;
      animation: neonGlow 4s infinite alternate ease-in-out;
    }
    .theme-neon .total-num {
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(6, 182, 212, 0.5);
      color: #38bdf8;
    }

    /* 3. FLAT DARK */
    .theme-flat-dark .viewers-widget {
      background: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
    }

    /* 4. FLAT LIGHT */
    .theme-flat-light .viewers-widget {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      color: #0f172a;
    }
    .theme-flat-light .viewer-label {
      color: #64748b !important;
    }
    .theme-flat-light .platform-pill {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* 5. PURE TRANSLUCENT */
    .theme-translucent .viewers-widget {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }

    /* =========================================================================
       LAYOUT STYLES (total, pills, badge, card, minimal)
       ========================================================================= */

    /* BASE WIDGET CONTAINER */
    .viewers-widget {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      border-radius: 9999px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* --- LAYOUT 1: COMBINED TOTAL (Default) --- */
    .layout-total .viewers-widget {
      padding: 10px 22px;
    }
    .layout-total .eye-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .layout-total .eye-icon {
      width: 22px;
      height: 22px;
      color: #38bdf8;
      filter: drop-shadow(0 2px 4px rgba(56, 189, 248, 0.4));
    }
    .layout-total .total-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .total-num {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      transition: color 0.3s ease;
    }
    .viewer-label {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }
    .layout-total .platform-mini-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
      padding-left: 10px;
      border-left: 1px solid rgba(255, 255, 255, 0.18);
    }
    .p-mini-dot {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.74rem;
      font-weight: 700;
      opacity: 0.9;
    }
    .p-mini-dot svg { width: 14px; height: 14px; }
    .p-mini-dot.twitch { color: #a855f7; }
    .p-mini-dot.youtube { color: #ef4444; }
    .p-mini-dot.tiktok { color: #06b6d4; }

    /* --- LAYOUT 2: MULTI-PLATFORM PILLS --- */
    .layout-pills .viewers-widget,
    .layout-minimal .viewers-widget {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      animation: none !important;
      filter: none !important;
      padding: 0 !important;
      gap: 10px;
      flex-wrap: wrap;
    }
    .platform-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1;
    }
    .theme-neon .platform-pill {
      background: rgba(10, 10, 20, 0.92) !important;
      border: 1.5px solid #06b6d4 !important;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4), inset 0 0 8px rgba(168, 85, 247, 0.25) !important;
      color: #f8fafc !important;
    }
    .theme-neon .platform-pill.total { border-color: #38bdf8 !important; }
    .theme-neon .platform-pill.twitch { border-color: #a855f7 !important; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4) !important; }
    .theme-neon .platform-pill.youtube { border-color: #ef4444 !important; box-shadow: 0 0 12px rgba(239, 68, 68, 0.4) !important; }
    .theme-neon .platform-pill.tiktok { border-color: #25f4ee !important; box-shadow: 0 0 12px rgba(37, 244, 238, 0.4) !important; }
    .platform-pill svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }
    .platform-pill.total {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.22);
    }
    .platform-pill.total .pill-num {
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .platform-pill.twitch { border-color: rgba(168, 85, 247, 0.4); }
    .platform-pill.twitch svg { color: #a855f7; }
    .platform-pill.youtube { border-color: rgba(239, 68, 68, 0.4); }
    .platform-pill.youtube svg { color: #ef4444; }
    .platform-pill.tiktok { border-color: rgba(6, 182, 212, 0.4); }
    .platform-pill.tiktok svg { color: #06b6d4; }

    /* --- LAYOUT 3: SPLIT COMPACT BADGE --- */
    .layout-badge .viewers-widget {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      gap: 0;
    }
    .badge-left {
      background: #ef4444;
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
    }
    .badge-left .pulse-dot {
      background: #ffffff;
      animation: none;
    }
    .badge-right {
      padding: 10px 18px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .badge-right .total-num {
      font-size: 1.45rem;
      font-weight: 800;
    }

    /* --- LAYOUT 4: HUD CARD --- */
    .layout-card .viewers-widget {
      flex-direction: column;
      align-items: stretch;
      border-radius: 16px;
      padding: 16px 20px;
      min-width: 200px;
      gap: 12px;
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-top .total-num {
      font-size: 2rem;
      font-weight: 900;
    }
    .card-platforms {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    .card-plat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 700;
    }
    .card-plat-item svg { width: 15px; height: 15px; }

    /* --- LAYOUT 5: MINIMAL TEXT --- */
    .layout-minimal .viewers-widget {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 4px 8px;
      gap: 8px;
    }
    .layout-minimal .total-num {
      font-size: 1.6rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }
    .layout-minimal .viewer-label {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
    }

    /* Zero Hidden platform helper */
    .platform-hidden {
      display: none !important;
    }

    /* Value change highlight flash */
    .number-flash {
      animation: countFlash 0.6s ease;
    }
    @keyframes countFlash {
      0% { transform: scale(1); }
      50% { transform: scale(1.18); color: #38bdf8; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body class="theme-frost layout-total">

  <div id="overlayViewport" class="overlay-viewport align-left scale-md">
    
    <!-- DYNAMIC CONTAINER -->
    <div id="viewersWidget" class="viewers-widget">
      <!-- Layout renders dynamically here -->
    </div>

  </div>

  <!-- Socket.IO Library -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    (function () {
      'use strict';

      // 1. Parse URL Parameters
      const params = new URLSearchParams(window.location.search);
      const optLayout = params.get('layout') || 'total'; // total, pills, badge, card, minimal
      const optTheme = params.get('theme') || 'frost';   // frost, neon, flat-dark, flat-light, translucent
      const optScale = params.get('scale') || 'md';      // sm, md, lg, xl
      const optAlign = params.get('align') || 'left';    // left, center, right
      const optFont = params.get('font') || 'inter';     // inter, jet, nunito
      const optLabel = params.has('label') ? params.get('label') : 'VIEWERS';
      const optHideZero = params.get('hideZero') === '1' || params.get('hideZero') === 'true';
      const optShowTotal = params.get('showTotal') !== '0' && params.get('showTotal') !== 'false';

      // Apply body classes
      document.body.className = `theme-${optTheme} layout-${optLayout}`;
      if (optFont === 'jet') document.body.classList.add('font-jet');
      if (optFont === 'nunito') document.body.classList.add('font-nunito');

      const viewport = document.getElementById('overlayViewport');
      if (viewport) {
        viewport.className = `overlay-viewport align-${optAlign} scale-${optScale}`;
      }

      const widgetContainer = document.getElementById('viewersWidget');

      // State
      let viewerCounts = {
        twitch: 0,
        youtube: 0,
        tiktok: 0
      };
      let previousTotal = 0;

      // Platform SVG Icons
      const ICONS = {
        eye: `<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
        twitch: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>`,
        youtube: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
        tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>`
      };

      function formatCount(num) {
        const n = Math.max(0, parseInt(num, 10) || 0);
        if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
        return n.toLocaleString('id-ID');
      }

      function getTotalViewers() {
        return (viewerCounts.twitch || 0) + (viewerCounts.youtube || 0) + (viewerCounts.tiktok || 0);
      }

      // Render Layout Framework
      function renderLayout() {
        if (!widgetContainer) return;

        const total = getTotalViewers();
        const labelText = optLabel ? `<span class="viewer-label">${optLabel}</span>` : '';

        if (optLayout === 'pills') {
          widgetContainer.innerHTML = `
            ${optShowTotal ? `
              <div class="platform-pill total" id="pillTotal">
                <span class="pulse-dot"></span>
                <span class="pill-num" id="valTotal">${formatCount(total)}</span>
                ${labelText}
              </div>
            ` : ''}
            <div class="platform-pill twitch ${optHideZero && !viewerCounts.twitch ? 'platform-hidden' : ''}" id="pillTwitch">
              ${ICONS.twitch}
              <span class="pill-num" id="valTwitch">${formatCount(viewerCounts.twitch)}</span>
            </div>
            <div class="platform-pill youtube ${optHideZero && !viewerCounts.youtube ? 'platform-hidden' : ''}" id="pillYouTube">
              ${ICONS.youtube}
              <span class="pill-num" id="valYouTube">${formatCount(viewerCounts.youtube)}</span>
            </div>
            <div class="platform-pill tiktok ${optHideZero && !viewerCounts.tiktok ? 'platform-hidden' : ''}" id="pillTikTok">
              ${ICONS.tiktok}
              <span class="pill-num" id="valTikTok">${formatCount(viewerCounts.tiktok)}</span>
            </div>
          `;
        } else if (optLayout === 'badge') {
          widgetContainer.innerHTML = `
            <div class="badge-left">
              <span class="pulse-dot"></span>
              <span>LIVE</span>
            </div>
            <div class="badge-right">
              <span class="total-num" id="valTotal">${formatCount(total)}</span>
              ${labelText}
            </div>
          `;
        } else if (optLayout === 'card') {
          widgetContainer.innerHTML = `
            <div class="card-top">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="pulse-dot"></span>
                ${labelText || '<span class="viewer-label">LIVE VIEWERS</span>'}
              </div>
              <span class="total-num" id="valTotal">${formatCount(total)}</span>
            </div>
            <div class="card-platforms">
              <div class="card-plat-item" style="color:#a855f7;">
                ${ICONS.twitch} <span id="valTwitch">${formatCount(viewerCounts.twitch)}</span>
              </div>
              <div class="card-plat-item" style="color:#ef4444;">
                ${ICONS.youtube} <span id="valYouTube">${formatCount(viewerCounts.youtube)}</span>
              </div>
              <div class="card-plat-item" style="color:#06b6d4;">
                ${ICONS.tiktok} <span id="valTikTok">${formatCount(viewerCounts.tiktok)}</span>
              </div>
            </div>
          `;
        } else if (optLayout === 'minimal') {
          widgetContainer.innerHTML = `
            <span class="pulse-dot"></span>
            <span class="total-num" id="valTotal">${formatCount(total)}</span>
            ${labelText}
          `;
        } else {
          // Default: Combined Total
          widgetContainer.innerHTML = `
            <div class="eye-wrap">
              <span class="pulse-dot"></span>
              ${ICONS.eye}
            </div>
            <div class="total-wrap">
              <span class="total-num" id="valTotal">${formatCount(total)}</span>
              ${labelText}
            </div>
            <div class="platform-mini-dots">
              <span class="p-mini-dot twitch ${optHideZero && !viewerCounts.twitch ? 'platform-hidden' : ''}" id="dotTwitch" title="Twitch">
                ${ICONS.twitch} <span id="valTwitch">${formatCount(viewerCounts.twitch)}</span>
              </span>
              <span class="p-mini-dot youtube ${optHideZero && !viewerCounts.youtube ? 'platform-hidden' : ''}" id="dotYouTube" title="YouTube">
                ${ICONS.youtube} <span id="valYouTube">${formatCount(viewerCounts.youtube)}</span>
              </span>
              <span class="p-mini-dot tiktok ${optHideZero && !viewerCounts.tiktok ? 'platform-hidden' : ''}" id="dotTikTok" title="TikTok">
                ${ICONS.tiktok} <span id="valTikTok">${formatCount(viewerCounts.tiktok)}</span>
              </span>
            </div>
          `;
        }
      }

      // Update values in DOM
      function updateDOM() {
        const total = getTotalViewers();

        const elTotal = document.getElementById('valTotal');
        if (elTotal) {
          if (total !== previousTotal) {
            elTotal.classList.add('number-flash');
            setTimeout(() => elTotal.classList.remove('number-flash'), 650);
          }
          elTotal.textContent = formatCount(total);
        }
        previousTotal = total;

        const elTwitch = document.getElementById('valTwitch');
        if (elTwitch) elTwitch.textContent = formatCount(viewerCounts.twitch);

        const elYouTube = document.getElementById('valYouTube');
        if (elYouTube) elYouTube.textContent = formatCount(viewerCounts.youtube);

        const elTikTok = document.getElementById('valTikTok');
        if (elTikTok) elTikTok.textContent = formatCount(viewerCounts.tiktok);

        // HideZero toggling
        if (optHideZero) {
          const pillTwitch = document.getElementById('pillTwitch') || document.getElementById('dotTwitch');
          if (pillTwitch) pillTwitch.classList.toggle('platform-hidden', !viewerCounts.twitch);

          const pillYT = document.getElementById('pillYouTube') || document.getElementById('dotYouTube');
          if (pillYT) pillYT.classList.toggle('platform-hidden', !viewerCounts.youtube);

          const pillTT = document.getElementById('pillTikTok') || document.getElementById('dotTikTok');
          if (pillTT) pillTT.classList.toggle('platform-hidden', !viewerCounts.tiktok);
        }
      }

      // Channel Resolution (From URL query params, user token, or localStorage)
      async function resolveChannels() {
        let ch = { twitch: '', youtube: '', tiktok: '' };
        const qToken = params.get('token') || localStorage.getItem('streampulse_user_token');
        const qUser = params.get('user') || params.get('username');

        // Jika ada token / username di URL, ambil saluran cloud dari server
        if (qToken || qUser) {
          try {
            const queryStr = qToken ? `token=${encodeURIComponent(qToken)}` : `user=${encodeURIComponent(qUser)}`;
            const res = await fetch(`/api/dock/config?${queryStr}`);
            if (res.ok) {
              const cfg = await res.json();
              if (cfg.success && cfg.channels) {
                ch = cfg.channels;
              }
            }
          } catch (e) {}
        }

        if (!ch.twitch && !ch.youtube && !ch.tiktok) {
          try {
            const raw = localStorage.getItem('streampulse_user_channels') ||
                        localStorage.getItem('streampulse_my_channels') ||
                        localStorage.getItem('streampulse_guest_channels');
            if (raw) ch = JSON.parse(raw);
          } catch (e) {}
        }

        return {
          twitch: (params.get('twitch') || ch.twitch || '').trim().toLowerCase().replace(/^[#@]/, ''),
          youtube: (params.get('youtube') || ch.youtube || '').trim(),
          tiktok: (params.get('tiktok') || ch.tiktok || '').trim().replace(/^@/, ''),
          userToken: qToken || ''
        };
      }

      // Initialize Socket.IO
      async function initSocket() {
        renderLayout();

        const resolved = await resolveChannels();
        const userToken = resolved.userToken || '';

        const socket = io({ transports: ['websocket', 'polling'] });

        socket.on('connect', () => {
          console.log('[Viewers Overlay] Connected to StreamPulse socket');
          socket.emit('update_channels', {
            twitch: resolved.twitch,
            youtube: resolved.youtube,
            tiktok: resolved.tiktok,
            userToken: userToken
          });
        });

        socket.on('initial_state', (data) => {
          if (data && data.viewerCounts) {
            viewerCounts.twitch = parseInt(data.viewerCounts.twitch, 10) || 0;
            viewerCounts.youtube = parseInt(data.viewerCounts.youtube, 10) || 0;
            viewerCounts.tiktok = parseInt(data.viewerCounts.tiktok, 10) || 0;
            updateDOM();
          }
        });

        socket.on('viewer_count', (payload) => {
          if (!payload || !payload.platform) return;
          const count = parseInt(payload.count, 10) || 0;
          if (payload.platform === 'twitch') viewerCounts.twitch = count;
          if (payload.platform === 'youtube') viewerCounts.youtube = count;
          if (payload.platform === 'tiktok') viewerCounts.tiktok = count;
          updateDOM();
        });

        // Demo / simulation listener from preview parent
        window.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SIMULATE_VIEWERS') {
            viewerCounts = { ...viewerCounts, ...event.data.counts };
            updateDOM();
          }
        });
      }

      initSocket();
    })();
  </script>
</body>
</html>
